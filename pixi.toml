[project]
name = "cyberdreamcatcher"
version = "0.0.0"
description = "An Attentive Graph Agent for Topology-Adaptive Cyber Defence"
authors = ["Ilya Orson Sandoval <ilya.orson@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64", "linux-aarch64", "linux-64"]

[host-dependencies]
python = "~=3.11"

[tasks]
install-cyborg = "pip install --no-build-isolation --no-deps --disable-pip-version-check --force-reinstall -e ./CybORG"
install-cyborg-debugged = "pip install --no-build-isolation --no-deps --disable-pip-version-check --force-reinstall -e ./CybORG_plus_plus/Debugged_CybORG/CybORG"
install-sb3 = "pip install --no-build-isolation --no-deps --disable-pip-version-check --force-reinstall stable-baselines3==2.3.2"
format = "ruff format cyberdreamcatcher scripts"
tutorial-cyborg = "jupyter-lab CybORG/CybORG/Tutorial/"
test-cyborg = "pytest CybORG/CybORG/Tests/test_sim"
test-graph-env = "python -m scripts.test-graph-env"
test-feasible-actions = "python -m scripts.test-feasible-actions"
list-scenarios = "python -m scripts.list-scenarios"
eval-cardiff = "python cardiff-cage-2/evaluation.py"
train-cardiff = "python cardiff-cage-2/train.py"
train-sb3-cage2 = "python -m scripts.train-sb3-cage2"
train-sb3-cage2-all-scenarios = "python -m scripts.train-sb3-cage2 --multirun scenario=Scenario2,Scenario2_+_User5,Scenario2_+_User5_User6,Scenario2_+_User6,Scenario2_-_User2,Scenario2_-_User2_User4,Scenario2_-_User4"
plot-network = "python -m scripts.plot-cyborg-layout"
train-gnn-botorch = "python -m scripts.train-gnn-botorch"
train-gnn-nevergrad = "python -m scripts.train-gnn-nevergrad"
train-gnn-reinforce = "python -m scripts.train-gnn-reinforce"
train-gnn-reinforce-all-scenarios = "python -m scripts.train-gnn-reinforce --multirun scenario=Scenario2,Scenario2_+_User5,Scenario2_+_User5_User6,Scenario2_+_User6,Scenario2_-_User2,Scenario2_-_User2_User4,Scenario2_-_User4"
# FIXME (see #20 in the GitHub repo) train-gnn-ppo = "python -m scripts.train-gnn-ppo"
sample-performance = "python -m scripts.sample-policy-performance"
sample-generalisation = "python -m scripts.sample-policy-generalisation"

[dependencies]
ipython = "~=8"
jupyterlab = "~=4"
matplotlib = "~=3.8"
numpy = "~=1.26"
pandas = ">=2.2.1,<2.3"
pip = "24.*"
prettytable = "~=3.9"
pyyaml = "~=6.0"
rich = "~=13.7"
paramiko = ">=3.4.0,<3.5"
pytest = ">=8.0.2,<8.1"
docutils = ">=0.20.1,<0.21"
tqdm = ">=4.66.2,<4.67"
ruff = ">=0.3.0,<0.4"
seaborn = ">=0.13.2,<0.14"
bidict = ">=0.23.1,<0.24"
hydra-core = ">=1.3.2,<1.4"
fsspec = ">=2024.6.1,<2025"

[pypi-dependencies]
gymnasium = "~=0.28.1"
hydra-joblib-launcher = ">=1.2.0, <2"
torch = "~=2.6"
# torch = { version = "~=2.6", index = "https://download.pytorch.org/whl/cpu" }  # clashes with cuda index

# alternative optimization packages
nevergrad = ">=1.0,<1.1"
botorch = ">=0.13.0,<0.14"
comet-ml = ">=3.49.8, <4"
torch-geometric = "==2.6.1"

[feature.cuda]
system-requirements = {cuda = "12.6"}
platforms = ["win-64", "linux-aarch64", "linux-64"]

[feature.cuda.pypi-dependencies]
torch = { version = "~=2.6", index = "https://download.pytorch.org/whl/cu126" }

[environments]
cuda = ["cuda"]
